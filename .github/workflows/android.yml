name: Android release APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"
      - name: Check signing configuration
        env:
          SLATE_KEYSTORE_BASE64: ${{ secrets.SLATE_KEYSTORE_BASE64 }}
          SLATE_KEYSTORE_PASSWORD: ${{ secrets.SLATE_KEYSTORE_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$SLATE_KEYSTORE_BASE64" || -z "$SLATE_KEYSTORE_PASSWORD" ]]; then
            echo "::error::Persistent signing secrets missing. Run scripts/setup-signing.sh once with access to Mikalia0/Slate."
            exit 1
          fi
      - name: Build and test signed release
        env:
          SLATE_KEYSTORE_BASE64: ${{ secrets.SLATE_KEYSTORE_BASE64 }}
          SLATE_KEYSTORE_PASSWORD: ${{ secrets.SLATE_KEYSTORE_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          export SLATE_KEYSTORE_PATH="$RUNNER_TEMP/slate-release.p12"
          trap 'rm -f "$SLATE_KEYSTORE_PATH"' EXIT
          printf '%s' "$SLATE_KEYSTORE_BASE64" | base64 --decode > "$SLATE_KEYSTORE_PATH"
          unset SLATE_KEYSTORE_BASE64
          export SLATE_VERSION_CODE="$((1000 + GITHUB_RUN_NUMBER))"
          gradle --no-daemon :app:testReleaseUnitTest :app:assembleRelease
          apk=app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$apk"
          cp "$apk" Slate.apk
      - name: Publish signed prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="dev-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          gh release create "$tag" Slate.apk \
            --target "$GITHUB_SHA" \
            --title "Slate development build ${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}" \
            --prerelease \
            --notes "Signed, non-debuggable release APK. Tests and APK signature verified. Commit: $GITHUB_SHA."
