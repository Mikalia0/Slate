name: Android release APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: slate-release-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0 ndk;27.2.12479018 cmake;3.22.1"
      - name: Check signing configuration
        env:
          SLATE_KEYSTORE_BASE64: ${{ secrets.SLATE_KEYSTORE_BASE64 }}
          SLATE_KEYSTORE_PASSWORD: ${{ secrets.SLATE_KEYSTORE_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$SLATE_KEYSTORE_BASE64" || -z "$SLATE_KEYSTORE_PASSWORD" ]]; then
            echo "::error::Persistent signing secrets missing. Run scripts/setup-signing.sh once with access to Mikalia0/Slate."
            exit 1
          fi
      - name: Build and test signed release
        env:
          SLATE_KEYSTORE_BASE64: ${{ secrets.SLATE_KEYSTORE_BASE64 }}
          SLATE_KEYSTORE_PASSWORD: ${{ secrets.SLATE_KEYSTORE_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          export SLATE_KEYSTORE_PATH="$RUNNER_TEMP/slate-release.p12"
          trap 'rm -f "$SLATE_KEYSTORE_PATH"' EXIT
          printf '%s' "$SLATE_KEYSTORE_BASE64" | base64 --decode > "$SLATE_KEYSTORE_PATH"
          unset SLATE_KEYSTORE_BASE64
          export SLATE_VERSION_CODE="$((1000 + GITHUB_RUN_NUMBER))"
          gradle --no-daemon :app:testReleaseUnitTest :app:assembleRelease
          apk=app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$apk"
          cp "$apk" Slate.apk
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '\r\n' < VERSION)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          code="$((1000 + GITHUB_RUN_NUMBER))"
          stable="v$version"
          # Pick the nearest ancestor with a published APK, not the first static changelog section.
          previous=""
          while IFS= read -r candidate; do
            [[ -n "$candidate" ]] || continue
            if git merge-base --is-ancestor "$candidate" "$GITHUB_SHA" && [[ "$(git rev-list -n 1 "$candidate")" != "$GITHUB_SHA" ]]; then
              previous="$candidate"
              break
            fi
          done < <(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[] | select(.draft == false) | select(any(.assets[]; .name == "Slate.apk")) | .tag_name')
          if [[ -n "$previous" ]]; then
            git log --no-merges --format='- %s' "$previous..$GITHUB_SHA" -- app VERSION scripts .github/workflows/android.yml > changelog.txt
          else
            awk '/^## /{if(seen++) exit; next} seen{print}' CHANGELOG.md > changelog.txt
          fi
          if [[ ! -s changelog.txt ]]; then printf '%s\n' '- Maintenance build; no application changes.' > changelog.txt; fi
          printf 'Version code: %s\n\n' "$code" > release-notes.md
          cat changelog.txt >> release-notes.md
          if ! gh release view "$stable" >/dev/null 2>&1; then
            tag="$stable"
            gh release create "$stable" Slate.apk changelog.txt \
              --target "$GITHUB_SHA" --title "Slate $stable" --latest=false --notes-file release-notes.md
          else
            tag="dev-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
            gh release create "$tag" Slate.apk changelog.txt \
              --target "$GITHUB_SHA" --title "Slate $version · Build ${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}" \
              --latest=false --notes-file release-notes.md
          fi
          bash scripts/publish-update-manifest.sh "$tag" "$code"
          # The update feed rejects older builds; use its selected release for Latest.
          git fetch --no-tags origin refs/heads/updates
          latest_tag="$(git show FETCH_HEAD:update.json | jq -er '.tag')"
          gh release edit "$latest_tag" --prerelease=false --latest
